name: OF
version: 0.3.4
variables:
  generator: ofGen v0.6.5
  addons: ProjectSourceFiles_ofxAssimpExample,ofxAssimp,ofxGui
  platform: macos
  ofPath: ../../..
abstracts:*:
  language: C++
  language[toolchain:apple-llvm]: Objective-C++
  settings:Cxx:
    cppStandard: c++20
    warningsPreset: minimal
    runtimeTypeInformation: true
    threads: true
    exceptions: true
    defines[toolchain:msvc]:
      - _CRT_SECURE_NO_WARNINGS
      - NDEBUG
      - _ASSERT_NO_CRT
      - UNICODE
      - _UNICODE
    defines[:macos]:
      - __MACOSX_CORE__
    defines[:debug]:
      - DEBUG
    compileOptions[:macos]:
      - -fobjc-arc
    compileOptions[toolchain:msvc]:
      - /D_CRT_NO_VA_START_VALIDATION
    includeDirs:
      - ${var:ofPath}/libs/openFrameworks/**
      - ${var:ofPath}/libs/{${var:platform}}/include
      - ${var:ofPath}/libs/{${var:platform}}/include/**
    includeDirs[:linux]:
      - /usr/include/gstreamer-1.0
      - /usr/include/glib-2.0
      - /usr/lib/x86_64-linux-gnu/glib-2.0/include
      - /usr/include/x86_64-linux-gnu
    appleFrameworks:
      - Accelerate
      - AGL
      - ApplicationServices
      - AVFoundation
      - IOKit
      - Cocoa
      - CoreAudio
      - CoreMedia
      - OpenGL
      - QuartzCore
