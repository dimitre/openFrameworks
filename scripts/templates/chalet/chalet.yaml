name: OF
version: "0.3.4"
variables:
  generator: manual
  addons: "ofxMicroUI,ofxTools,ofxMidi,ofxMicroUIMidiController,ofxScenes,ofxSvg,ofxCurve,ofxVideoWriter,ofxAssimp"
  platform: macos
  ofPath: ../../..
# externalDependencies:
#   ofLib:
#     kind: local
#     path: ${var:ofPath}
# package:
#   of-static:
#     # kind: staticLibrary
#     files:
#       include:
#         - ${var:ofPath}/libs/openFrameworks/{3d,communication,events,gl,graphics,math,sound,types,utils,video}/*.cpp
#         - ${var:ofPath}/libs/openFrameworks/app/{ofBaseApp,ofMainLoop,ofAppRunner,ofAppGLFWWindow}.cpp
#       include[:macos]:
#         - ${var:ofPath}/libs/openFrameworks/**.{mm,m}

#       exclude[:macos]:
#         - ${var:ofPath}/libs/openFrameworks/video/ofDirectShowPlayer.cpp
#         - ${var:ofPath}/libs/openFrameworks/video/{ofGstVideoGrabber,ofGstVideoPlayer,ofGstUtils,ofMediaFoundationPlayer,ofDirectShowGrabber}.cpp
#         - ${var:ofPath}/libs/openFrameworks/sound/{ofMediaFoundationSoundPlayer}.cpp

abstracts:*:
  language: C++
  language[toolchain:apple-llvm]: Objective-C++
  settings:Cxx:
    cppStandard: c++20
    # compileOptions[:macos]:
    # - -Wfatal-errors
    warningsPreset: minimal
    runtimeTypeInformation: true
    threads: true
    exceptions: true
    defines:
      - OF
    defines[:debug]:
      - DEBUG

    linkerOptions[:linux]:
      - -pthread

    defines[:linux]:
      - OF_USING_GTK
      # - OF_USING_STD_FS=1

    defines[:macos]:
      - __MACOSX_CORE__
    # compileOptions[toolchain:apple-llvm]:
    compileOptions[:macos]:
      - -fobjc-arc

    defines[toolchain:msvc]:
      - _CRT_SECURE_NO_WARNINGS
      - NDEBUG
      - _ASSERT_NO_CRT
      - UNICODE
      - _UNICODE
      # - URI_STATIC
      - URI_STATIC_BUILD
      - FREEIMAGE_LIB
      - JPEG_STATIC
      - TIFF_STATIC
      - ZLIB_CONST
      # only for libfreenect, ofxKinect. if it works it can be moved there.
      - strdup=_strdup
      # FIXME: remove this from core, and put back here
      # - GLEW_STATIC

    linkerOptions[toolchain:msvc]:
      # - /NODEFAULTLIB:libcmt
      - /NODEFAULTLIB:MSVCRT # Changed from libcmt
      - /FORCE:MULTIPLE

    staticRuntimeLibrary: true
    compileOptions[toolchain:msvc]:
      - /D_CRT_NO_VA_START_VALIDATION
      - /MT

    # compileOptions[toolchain:msvc+configuration:release]:
    #   - /MT

    # compileOptions[toolchain:msvc+configuration:debug]:
    #   - /MTd

    includeDirs:
      - ${var:ofPath}/libs/openFrameworks/**
      # - ${var:ofPath}/libs/openFrameworks
      - ${var:ofPath}/libs/{${var:platform}}/include
      - ${var:ofPath}/libs/{${var:platform}}/include/**

    compileOptions[:linux+architecture:x86_64]:
      - -msse2
      - -msse
      - -mfpmath=sse

    includeDirs[:linux]:
      - /usr/include/gstreamer-1.0
      - /usr/include/glib-2.0
      - /usr/lib/x86_64-linux-gnu/glib-2.0/include
      - /usr/include/x86_64-linux-gnu
      - /usr/include/cairo
      - /usr/include/pango-1.0
      - /usr/include/harfbuzz

      # not sure if needed
      - /usr/include/{freetype2,libpng16,glib-2.0,libmount,blkid,fribidi,pixman-1,gdk-pixbuf-2.0,webp,graphene-1.0}

      - /usr/include/gtk-2.0
      - /usr/lib/x86_64-linux-gnu/{gtk-2.0,glib-2.0}/include
      - /usr/include/atk-1.0

      # - /usr/include/gtk-4.0
      # - /usr/lib/x86_64-linux-gnu/graphene-1.0/include

    appleFrameworks:
      - Accelerate
      - AGL
      - ApplicationServices
      - AVFoundation
      - IOKit
      - Cocoa
      - CoreAudio
      - CoreMedia
      - OpenGL
      - QuartzCore
      # - CoreMIDI
      #

    links[:linux]:
      - glfw

      # - gtk+-2.0
      # - gtk4
      # - graphene-1.0
      - Xrandr
      - Xxf86vm
      - Xi
      - Xcursor
      - Xinerama
      - glut # -lglut (freeglut is only used for one legacy function,
        #           but OF links it anyway)
      - dl # -ldl

      - gstapp-1.0
      - gstvideo-1.0
      - gstbase-1.0
      - gstreamer-1.0
      - udev
      - sndfile
      - openal
      - ssl
      - crypto
      - curl
      - pulse-simple
      - pulse
      - pthread
      - asound
      - GL
      - GLU
      - gtk-x11-2.0
      - gdk-x11-2.0
      - pangocairo-1.0
      - atk-1.0
      # move aside soon
      - cairo
      - gdk_pixbuf-2.0
      - gio-2.0
      - pangoft2-1.0
      - pango-1.0
      - gobject-2.0
      - glib-2.0
      - harfbuzz
      - fontconfig
      - freetype
      - mpg123

    # defines[:windows]:
    #   - FREEIMAGE_LIB
    #   - URI_STATIC

    links[:windows]:
      - winmm # timeBeginPeriod / timeEndPeriod
      - opengl32 # classic OpenGL 1.x entry-points
      - mfplat # Add this - Media Foundation Platform
      - mfreadwrite # Add this - Media Foundation Read/Write
      - mfuuid # Add this - Media Foundation UUIDs
      - d3d11 # Add this - Direct3D 11
      - dxgi # Add this - DirectX Graphics Infrastructure

      - Ws2_32 # ofxNetwork. I can move only there later
      # - uriparser # URI parsing
      # - glew32 # GLEW extension loader
      # - FreeImage

    staticLinks[:windows]:
      # - ${var:ofPath}/libs/${var:platform}/lib/jpeg-static.lib
      - ${var:ofPath}/libs/${var:platform}/lib/FreeImage.lib
      # - ${var:ofPath}/libs/${var:platform}/lib/tiff.lib
      # - ${var:ofPath}/libs/${var:platform}/lib/tiffxx.lib
      # - removed tiff.lib
      - ${var:ofPath}/libs/${var:platform}/lib/turbojpeg-static.lib
      - ${var:ofPath}/libs/${var:platform}/lib/zs.lib

      - ${var:ofPath}/libs/${var:platform}/lib/brotlicommon.lib
      - ${var:ofPath}/libs/${var:platform}/lib/brotlidec.lib
      - ${var:ofPath}/libs/${var:platform}/lib/brotlienc.lib
      - ${var:ofPath}/libs/${var:platform}/lib/freetype.lib
      - ${var:ofPath}/libs/${var:platform}/lib/glew.lib
      - ${var:ofPath}/libs/${var:platform}/lib/glfw3.lib
      - ${var:ofPath}/libs/${var:platform}/lib/glm.lib
      - ${var:ofPath}/libs/${var:platform}/lib/libpng18_static.lib
      - ${var:ofPath}/libs/${var:platform}/lib/pugixml.lib
      # - ${var:ofPath}/libs/${var:platform}/lib/rtaudio.lib
      - ${var:ofPath}/libs/${var:platform}/lib/tess2.lib
      - ${var:ofPath}/libs/${var:platform}/lib/uriparser.lib
      - ${var:ofPath}/libs/${var:platform}/lib/videoInput.lib
      # - ${var:ofPath}/libs/${var:platform}/lib/yaml-cpp.lib

    staticLinks[:linux]:
      #libpng, libbrotlienc, libjpeg libbrotlicommon,libbrotlidec
      # - ${var:ofPath}/libs/${var:platform}/lib/libglfw3.a

      - ${var:ofPath}/libs/${var:platform}/lib/libFreeImage.a
      - ${var:ofPath}/libs/${var:platform}/lib/libfreetype.a
      - ${var:ofPath}/libs/${var:platform}/lib/libglew.a
      - ${var:ofPath}/libs/${var:platform}/lib/libglm.a
      # - ${var:ofPath}/libs/${var:platform}/lib/libjpeg.a
      - ${var:ofPath}/libs/${var:platform}/lib/libkissfft-float.a
      - ${var:ofPath}/libs/${var:platform}/lib/libpng.a
      # - ${var:ofPath}/libs/${var:platform}/lib/libpng16.a
      # - ${var:ofPath}/libs/${var:platform}/lib/libpng18.a
      - ${var:ofPath}/libs/${var:platform}/lib/libpugixml.a
      - ${var:ofPath}/libs/${var:platform}/lib/librtaudio.a
      - ${var:ofPath}/libs/${var:platform}/lib/libtess2.a
      - ${var:ofPath}/libs/${var:platform}/lib/libtiff.a
      # - ${var:ofPath}/libs/${var:platform}/lib/libtiffxx.a
      - ${var:ofPath}/libs/${var:platform}/lib/libturbojpeg.a
      - ${var:ofPath}/libs/${var:platform}/lib/liburiparser.a
      - ${var:ofPath}/libs/${var:platform}/lib/libz.a

    staticLinks[:macos]:
      - ${var:ofPath}/libs/${var:platform}/lib/libglew.a
      - ${var:ofPath}/libs/${var:platform}/lib/libglfw3.a
      - ${var:ofPath}/libs/${var:platform}/lib/libtess2.a
      - ${var:ofPath}/libs/${var:platform}/lib/libglm.a
      - ${var:ofPath}/libs/${var:platform}/lib/libfreetype.a
      - ${var:ofPath}/libs/${var:platform}/lib/libbrotlidec.a
      - ${var:ofPath}/libs/${var:platform}/lib/libbrotlicommon.a
      - ${var:ofPath}/libs/${var:platform}/lib/liburiparser.a
      - ${var:ofPath}/libs/${var:platform}/lib/libpugixml.a
      - ${var:ofPath}/libs/${var:platform}/lib/librtaudio.a

      # FREEIMAGE
      - ${var:ofPath}/libs/${var:platform}/lib/libpng18.a
      - ${var:ofPath}/libs/${var:platform}/lib/libFreeImage.a
      - ${var:ofPath}/libs/${var:platform}/lib/libturbojpeg.a
      - ${var:ofPath}/libs/${var:platform}/lib/libbrotlienc.a
      # - ${var:ofPath}/libs/${var:platform}/lib/libtiff.a
      # - ${var:ofPath}/libs/${var:platform}/lib/libtiffxx.a
      - ${var:ofPath}/libs/${var:platform}/lib/libz.a
      - ${var:ofPath}/libs/${var:platform}/lib/liblzma.a
targets:
  # OFLib:
  #   kind: chaletProject
  #   location: ${var:ofPath}
  OF:
    kind: staticLibrary
    files:
      include:
        - ${var:ofPath}/libs/openFrameworks/{3d,communication,events,gl,graphics,math,sound,types,utils,video}/*.cpp
        - ${var:ofPath}/libs/openFrameworks/app/{ofBaseApp,ofMainLoop,ofAppRunner,ofAppGLFWWindow}.cpp
      include[:macos]:
        - ${var:ofPath}/libs/openFrameworks/**.{mm,m}

      exclude[:macos]:
        - ${var:ofPath}/libs/openFrameworks/video/{ofGstVideoGrabber,ofGstVideoPlayer,ofGstUtils,ofMediaFoundationPlayer,ofDirectShowGrabber,ofDirectShowPlayer}.cpp
        - ${var:ofPath}/libs/openFrameworks/sound/{ofMediaFoundationSoundPlayer}.cpp

      exclude[:linux]:
        - ${var:ofPath}/libs/openFrameworks/video/{ofDirectShowPlayer,ofDirectShowGrabber,ofMediaFoundationPlayer}.cpp
        - ${var:ofPath}/libs/openFrameworks/sound/{ofMediaFoundationSoundPlayer}.cpp
        - ${var:ofPath}/libs/openFrameworks/app/ofAppGlutWindow.cpp
      exclude[:windows]:
        - ${var:ofPath}/libs/openFrameworks/video/{ofGstVideoGrabber,ofGstVideoPlayer,ofGstUtils}.cpp
        # - ${var:ofPath}/libs/openFrameworks/video/{ofDirectShowPlayer,ofDirectShowGrabber,ofMediaFoundationPlayer}.cpp
        - ${var:ofPath}/libs/openFrameworks/sound/ofFmodSoundPlayer.cpp

  empty:
    kind: executable
    runWorkingDirectory: "bin"
    # runWorkingDirectory: ${cwd}/bin

    # importPackages: [of-static]

    settings:Cxx:
      staticLinks:
        - OF

        # - /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/usr/lib/liblzma.5.tbd

      includeDirs:
        # - ${var:ofPath}/libs/openFrameworks/**
        - ${var:ofPath}/libs/openFrameworks
    files:
      include:

      exclude:
        - .DS_Store
        - .settings
        - .vscode
        - .clangd
        - .zed
        - compile_flags.txt
        # - ${var:ofPath}/addons/{${var:addons}}/src/ios

    # copyFilesOnRun[:macos]: bin/data
    copyFilesOnRun: bin/data

distribution:
  empty:
    kind: bundle
    buildTargets: "*"
    exclude:
      - data/.gitkeep
    macosBundle:
      type: app
      icon: ${var:ofPath}/libs/openFrameworksCompiled/project/macos/of.icns
      infoPropertyList:
        CFBundleDevelopmentRegion: en-US
        CFBundleDisplayName: ${name}
        CFBundleExecutable: ${mainExecutable}
        CFBundleIconFile: ${icon}
        CFBundleIdentifier: com.developer.application
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: ${bundleName}
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1.0.0"
        CFBundleSignature: "????"
        LSMinimumSystemVersion: "10.8"
        NSHighResolutionCapable: true
