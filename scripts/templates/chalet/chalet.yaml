name: ofWorksProject
version: "0.0.1"
variables:
  generator: manual
  platform: macos
  ofPath: ../../..

abstracts:*:
  # $embed("${var:ofPath}/libs/openFrameworksCompiled/project/chalet/of-common.yaml")
  language: C++
  language[toolchain:apple-llvm]: Objective-C++
  settings:Cxx:
    cppStandard: c++20
    compileOptions:
      - -D_FORTIFY_SOURCE=3
    compileOptions[:!windows]:
      - -fstack-protector-strong

    # compileOptions[:macos]:
    # - -Wfatal-errors
    # minimal extra pedantic strict strictPedantic
    warningsPreset: minimal
    # warningsPreset: extra
    # warnings: [fatal-errors]
    # treatWarningsAsErrors: true
    runtimeTypeInformation: true
    threads: true
    exceptions: true
    # defines:
    # - TARGET_GLFW_WINDOW
    # - OF
    defines[:macos]:
      - GL_SILENCE_DEPRECATION
      - GLES_SILENCE_DEPRECATION
    defines[:debug]:
      - DEBUG

    linkerOptions[:linux]:
      - -pthread

    # defines[:linux]:
    # - OF_USING_GTK
    # - OF_USING_STD_FS=1

    compileOptions[:macos]:
      - -fobjc-arc
      - -mmacosx-version-min=12.0 # Add this line

    linkerOptions[:macos]:
      - -mmacosx-version-min=12.0

    defines[toolchain:msvc]:
      - _CRT_SECURE_NO_WARNINGS
      - NDEBUG
      - _ASSERT_NO_CRT
      - UNICODE
      - _UNICODE
      # - URI_STATIC
      - URI_STATIC_BUILD

      # only for libfreenect, ofxKinect. if it works it can be moved there.
      - strdup=_strdup
      # FIXME: remove this from core, and put back here
      # - GLEW_STATIC

    linkerOptions[toolchain:msvc]:
      - /NODEFAULTLIB:MSVCRT # Changed from libcmt
      # now removed. no freetype anymore
      # - /FORCE:MULTIPLE

    staticRuntimeLibrary: true
    compileOptions[toolchain:msvc]:
      # FIXME: Test removing this
      # - /D_CRT_NO_VA_START_VALIDATION
      - /MT
      # trying to make ccache work on gh actions
      - /Z7
      - /MP1 # Or find where /MP is set and remove it

    includeDirs:
      - ${var:ofPath}/libs/openFrameworks/*
      - ${var:ofPath}/libs/{${var:platform}}/include
      - ${var:ofPath}/libs/{${var:platform}}/include/freetype2
      # - ${var:ofPath}/libs/{${var:platform}}/include/**

    compileOptions[:linux+architecture:x86_64]:
      - -msse2
      - -msse
      - -mfpmath=sse

    includeDirs[:linux]:
      - /usr/include/gstreamer-1.0
      - /usr/include/glib-2.0 # included by gstreamer-1.0
      - /usr/lib/glib-2.0/include # needed in arch. will it be ok in Ubuntu?
      # not sure if needed
      # - /usr/include/{freetype2,libpng16}

      # - /usr/include/cairo
      # - /usr/include/pango-1.0
      # - /usr/include/harfbuzz

      # - /usr/include/{glib-2.0,libmount,blkid,fribidi,pixman-1,gdk-pixbuf-2.0,webp,graphene-1.0}

      # - /usr/include/gtk-2.0
      # - /usr/lib/x86_64-linux-gnu/{gtk-2.0,glib-2.0}/include
      # - /usr/include/atk-1.0

    includeDirs[:linux+architecture:x86_64]:
      - /usr/include/x86_64-linux-gnu
      - /usr/lib/x86_64-linux-gnu/glib-2.0/include

    # includeDirs[:linux+architecture:aarch64-linux-gnu]:
    includeDirs[:linux+architecture:aarch64]:
      - /usr/include/aarch64-linux-gnu
      - /usr/lib/aarch64-linux-gnu/glib-2.0/include

    appleFrameworks:
      - Accelerate
      - ApplicationServices
      - AVFoundation
      - IOKit
      - Cocoa
      - CoreAudio
      - CoreMedia
      - OpenGL
      - QuartzCore

    links[:linux]:
      - wayland-client
      - wayland-cursor
      - wayland-egl
      - xkbcommon
      # - glfw
      - fontconfig
      - Xrandr
      - Xxf86vm
      - Xi
      - Xcursor
      - Xinerama
      # -lglut (freeglut is only used for one legacy function, but OF links it anyway)
      - glut
      - dl
      - gstapp-1.0
      - gstvideo-1.0
      - gstbase-1.0
      - gstreamer-1.0

      # - asound
      - openal
      - sndfile

      # - pulse-simple
      # - pulse
      - pthread
      - GL
      - GLU
      # - mpg123

      - udev # ofxkinect only

      # - harfbuzz
      # - fontconfig
      # - freetype

      # - gtk-x11-2.0
      # - gdk-x11-2.0
      # - atk-1.0
      # - gdk_pixbuf-2.0
      # move aside soon
      # GTK Related
      # - glib-2.0
      # - gobject-2.0
      # - gio-2.0

      # - cairo
      # - pangocairo-1.0
      # - pangoft2-1.0
      # - pango-1.0

      # FIXME: Move to ofxURL addon
      # - ssl
      # - crypto
      # - curl

    links[:windows]:
      - winmm # timeBeginPeriod / timeEndPeriod
      - opengl32 # classic OpenGL 1.x entry-points
      - mfplat # Add this - Media Foundation Platform
      - mfreadwrite # Add this - Media Foundation Read/Write
      - mfuuid # Add this - Media Foundation UUIDs
      - d3d11 # Add this - Direct3D 11
      - dxgi # Add this - DirectX Graphics Infrastructure
      - Ws2_32 # ofxNetwork. I can move only there later
      # - uriparser # URI parsing
      # - glew32 # GLEW extension loader

    staticLinks[:windows]:
      # - ${var:ofPath}/libs/${var:platform}/lib/kissfft-float.lib

      - ${var:ofPath}/libs/${var:platform}/lib/mango.lib
      - ${var:ofPath}/libs/${var:platform}/lib/bz2_static.lib
      - ${var:ofPath}/libs/${var:platform}/lib/deflatestatic.lib
      - ${var:ofPath}/libs/${var:platform}/lib/lcms2.lib
      - ${var:ofPath}/libs/${var:platform}/lib/lz4.lib
      - ${var:ofPath}/libs/${var:platform}/lib/zstd_static.lib

      - ${var:ofPath}/libs/${var:platform}/lib/fmt.lib

      # - ${var:ofPath}/libs/${var:platform}/lib/tiffxx.lib
      # - removed tiff.lib
      - ${var:ofPath}/libs/${var:platform}/lib/zlibstatic.lib

      - ${var:ofPath}/libs/${var:platform}/lib/freetype.lib
      # - ${var:ofPath}/libs/${var:platform}/lib/brotlicommon.lib
      # - ${var:ofPath}/libs/${var:platform}/lib/brotlidec.lib
      # - ${var:ofPath}/libs/${var:platform}/lib/brotlienc.lib
      # - ${var:ofPath}/libs/${var:platform}/lib/libpng18_static.lib

      - ${var:ofPath}/libs/${var:platform}/lib/glew.lib
      - ${var:ofPath}/libs/${var:platform}/lib/glfw3.lib
      - ${var:ofPath}/libs/${var:platform}/lib/glm.lib
      - ${var:ofPath}/libs/${var:platform}/lib/pugixml.lib
      - ${var:ofPath}/libs/${var:platform}/lib/rtaudio.lib
      - ${var:ofPath}/libs/${var:platform}/lib/tess2.lib
      - ${var:ofPath}/libs/${var:platform}/lib/uriparser.lib
      - ${var:ofPath}/libs/${var:platform}/lib/videoInput.lib
      # - ${var:ofPath}/libs/${var:platform}/lib/yaml-cpp.lib

    staticLinks[:linux]:
      - ${var:ofPath}/libs/${var:platform}/lib/libglfw3.a
      - ${var:ofPath}/libs/${var:platform}/lib/libfmt.a

      - ${var:ofPath}/libs/${var:platform}/lib/libmango.a
      - ${var:ofPath}/libs/${var:platform}/lib/libbz2_static.a
      - ${var:ofPath}/libs/${var:platform}/lib/libdeflate.a
      - ${var:ofPath}/libs/${var:platform}/lib/liblz4.a
      - ${var:ofPath}/libs/${var:platform}/lib/libzstd.a

      - ${var:ofPath}/libs/${var:platform}/lib/libfreetype.a
      # - ${var:ofPath}/libs/${var:platform}/lib/libpng.a

      - ${var:ofPath}/libs/${var:platform}/lib/libglew.a
      - ${var:ofPath}/libs/${var:platform}/lib/libglm.a
      - ${var:ofPath}/libs/${var:platform}/lib/libkissfft-float.a
      - ${var:ofPath}/libs/${var:platform}/lib/libpugixml.a
      - ${var:ofPath}/libs/${var:platform}/lib/librtaudio.a
      - ${var:ofPath}/libs/${var:platform}/lib/libtess2.a
      - ${var:ofPath}/libs/${var:platform}/lib/liburiparser.a
      - ${var:ofPath}/libs/${var:platform}/lib/libz.a

      - ${var:ofPath}/libs/${var:platform}/lib/liblcms2.a
    # staticLinks[:linux+architecture:aarch64]:
    #   - ${var:ofPath}/libs/${var:platform}/lib/aarch64-linux-gnu/liblcms2.a
    # staticLinks[:linux+architecture:x86_64]:
    #   - ${var:ofPath}/libs/${var:platform}/lib/x86_64-linux-gnu/liblcms2.a

    staticLinks[:macos]:
      - ${var:ofPath}/libs/${var:platform}/lib/libkissfft-float.a

      - ${var:ofPath}/libs/${var:platform}/lib/libglew.a
      - ${var:ofPath}/libs/${var:platform}/lib/libglfw3.a
      - ${var:ofPath}/libs/${var:platform}/lib/libtess2.a
      - ${var:ofPath}/libs/${var:platform}/lib/libglm.a
      - ${var:ofPath}/libs/${var:platform}/lib/liburiparser.a
      - ${var:ofPath}/libs/${var:platform}/lib/libpugixml.a
      - ${var:ofPath}/libs/${var:platform}/lib/librtaudio.a

      # All Freetype deps
      - ${var:ofPath}/libs/${var:platform}/lib/libfreetype.a
      # - ${var:ofPath}/libs/${var:platform}/lib/libbrotlidec.a
      # - ${var:ofPath}/libs/${var:platform}/lib/libbrotlicommon.a
      # - ${var:ofPath}/libs/${var:platform}/lib/libbrotlienc.a
      # - ${var:ofPath}/libs/${var:platform}/lib/libpng.a
      - ${var:ofPath}/libs/${var:platform}/lib/libz.a

      - ${var:ofPath}/libs/${var:platform}/lib/libfmt.a

      - ${var:ofPath}/libs/${var:platform}/lib/libmango.a
      - ${var:ofPath}/libs/${var:platform}/lib/libbz2_static.a
      - ${var:ofPath}/libs/${var:platform}/lib/libdeflate.a
      - ${var:ofPath}/libs/${var:platform}/lib/liblcms2.a
      - ${var:ofPath}/libs/${var:platform}/lib/liblz4.a
      - ${var:ofPath}/libs/${var:platform}/lib/libzstd.a
targets:
  ofWorks:
    kind: staticLibrary
    files:
      include:
        - ${var:ofPath}/libs/openFrameworks/{3d,communication,events,gl,graphics,math,sound,types,utils,video}/*.cpp
        - ${var:ofPath}/libs/openFrameworks/app/{ofBaseApp,ofMainLoop,ofAppRunner,ofAppGLFWWindow}.cpp

      include[:macos]:
        - ${var:ofPath}/libs/openFrameworks/**.{mm,m}

      exclude:
        - .cache
        - .DS_Store
        - .settings
        - .vscode
        - .zed
        - compile_flags.txt

      exclude[:macos]:
        - ${var:ofPath}/libs/openFrameworks/video/{ofGstVideoGrabber,ofGstVideoPlayer,ofGstUtils,ofMediaFoundationPlayer,ofDirectShowGrabber,ofDirectShowPlayer}.cpp
        - ${var:ofPath}/libs/openFrameworks/sound/ofMediaFoundationSoundPlayer.cpp

      exclude[:linux]:
        - ${var:ofPath}/libs/openFrameworks/video/{ofDirectShowPlayer,ofDirectShowGrabber,ofMediaFoundationPlayer}.cpp
        - ${var:ofPath}/libs/openFrameworks/sound/ofMediaFoundationSoundPlayer.cpp
        # - ${var:ofPath}/libs/openFrameworks/app/ofAppGlutWindow.cpp

        # - ${var:ofPath}/libs/openFrameworks/sound/{ofOpenALSoundPlayer}.cpp
      exclude[:windows]:
        - ${var:ofPath}/libs/openFrameworks/video/{ofGstVideoGrabber,ofGstVideoPlayer,ofGstUtils}.cpp
        - ${var:ofPath}/libs/openFrameworks/sound/ofFmodSoundPlayer.cpp
        # - ${var:ofPath}/libs/openFrameworks/sound/ofRtAudioSoundStream.cpp
        - ${var:ofPath}/libs/openFrameworks/sound/ofOpenALSoundPlayer.cpp

        # new, 17 jan 2026
        - ${var:ofPath}/libs/openFrameworks/sound/ofSoundFFT.cpp

  empty:
    kind: executable
    runWorkingDirectory: ${cwd}/bin

    #windowsApplicationIcon: icon/app.ico

    # copyFilesOnRun: bin/data
    # externalConfiguration: ${var:ofPath}/libs/openFrameworksCompiled/project/chalet/configuration.yaml

    settings:Cxx:
      staticLinks:
        - ofWorks
      includeDirs:
        - ${var:ofPath}/libs/openFrameworks
      # windowsApplicationIcon: platform/windows/app.ico
    files:
      include:

      exclude:
        - .DS_Store
        - .settings
        - .vscode
        - .clangd
        - .zed
        - compile_flags.txt
        # - ${var:ofPath}/addons/{${var:addons}}/src/ios

distribution:
  empty:
    kind: bundle
    buildTargets: empty
    exclude:
      - data/.gitkeep

    # linuxDesktopEntry:
    #   icon: ${var:ofPath}/scripts/ofWorks.png
    #   template: platform/linux/app.desktop
    # # copyToApplications: true

    macosBundle:
      type: app
      # icon: ${var:ofPath}/libs/openFrameworksCompiled/project/macos/of.icns
      icon: ${var:ofPath}/scripts/ofWorks.png
      iconMethod: sips
      infoPropertyList:
        CFBundleDevelopmentRegion: en-US
        CFBundleDisplayName: ${name}
        CFBundleExecutable: ${mainExecutable}
        CFBundleIconFile: ${icon}
        CFBundleIdentifier: cc.ofWorks.${name}
        CFBundleInfoDictionaryVersion: 6.0
        CFBundleName: ${bundleName}
        CFBundlePackageType: APPL
        CFBundleSignature: ????
        CFBundleShortVersionString: ${version}
        CFBundleVersion: ${version}
        LSMinimumSystemVersion: "11.6.0"
        NSHighResolutionCapable: true
        NSCameraUsageDescription: This app needs to access the camera
        NSMicrophoneUsageDescription: This app needs to access the microphone
        # NSCameraUseContinuityCameraDeviceType: false
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: Made using ofworks.cc (openFrameworks fork)

