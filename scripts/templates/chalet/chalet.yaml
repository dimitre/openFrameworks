name: OF
version: "0.3.3"
variables:
  generator: manual
  addons: "ofxMicroUI,ofxTools,ofxMidi,ofxMicroUIMidiController,ofxScenes,ofxSvg,ofxCurve,ofxVideoWriter,ofxAssimp"
  platform: macos
  ofPath: ../../..
externalDependencies:
  ofLib:
    kind: local
    path: ${var:ofPath}
abstracts:*:
  language: C++
  language[toolchain:apple-llvm]: Objective-C++
  settings:Cxx:
    cppStandard: c++20
    # compileOptions[:macos]:
    # - -Wfatal-errors
    warningsPreset: minimal
    runtimeTypeInformation: true
    threads: true
    exceptions: true
    defines:
      - __MACOSX_CORE__
    defines[:debug]:
      - DEBUG
    # compileOptions[toolchain:apple-llvm]:
    compileOptions[:macos]:
      - -fobjc-arc
    includeDirs:
      - ${var:ofPath}/libs/openFrameworks/**
      # - ${var:ofPath}/libs/openFrameworks
      - ${var:ofPath}/libs/{${var:platform}}/include
    # includeDirs[:macos]:
    # libDirs[:macos]: ${var:ofPath}/libs/fmod/lib/osx
    # links[:macos]: fmod
    # staticLinks[:macos]:
    # - ${var:ofPath}/libs/macos/lib/**.a
    # - ${var:ofPath}/libs/macos/lib/{tess}.a
    # - ${var:ofPath}/libs/macos/lib/{libbrotlienc,libfreetype,libpixman-1,librtaudio,libz,libFreeImage,libcairo,libglew,libpng,libssl,libbrotlicommon,libcrypto,libglfw3,libpng16,libtess2,libbrotlidec,libcurl,libglm,libpugixml,liburiparser}.a
    appleFrameworks:
      - Accelerate
      - AGL
      - ApplicationServices
      - AVFoundation
      - IOKit
      - Cocoa
      - CoreAudio
      - CoreMedia
      - OpenGL
      - QuartzCore
      # - CoreMIDI
targets:
  empty:
    # importPackages: [ofLib]
    kind: executable
    settings:Cxx:
      staticLinks:
        # - ${var:ofPath}/addons/ofxAssimp/libs/assimp/lib/${var:platform}/libassimp.a

        # - ${var:ofPath}/libs/openFrameworksCompiled/lib/${var:platform}/openFrameworks.a
        - ${var:ofPath}/libs/openFrameworksCompiled/lib/${var:platform}/libopenFrameworks.a
        # - ${var:ofPath}/libs/openFrameworksCompiled/lib/${var:platform}/libopenFrameworks.a
        - ${var:ofPath}/libs/${var:platform}/lib/libglew.a
        - ${var:ofPath}/libs/${var:platform}/lib/libglfw3.a
        - ${var:ofPath}/libs/${var:platform}/lib/libtess2.a
        - ${var:ofPath}/libs/${var:platform}/lib/libFreeImage.a
        - ${var:ofPath}/libs/${var:platform}/lib/libpng16.a
        - ${var:ofPath}/libs/${var:platform}/lib/libglm.a
        - ${var:ofPath}/libs/${var:platform}/lib/libfreetype.a
        - ${var:ofPath}/libs/${var:platform}/lib/libbrotlidec.a
        - ${var:ofPath}/libs/${var:platform}/lib/libbrotlicommon.a
        - ${var:ofPath}/libs/${var:platform}/lib/liburiparser.a
        - ${var:ofPath}/libs/${var:platform}/lib/libpugixml.a
        - ${var:ofPath}/libs/${var:platform}/lib/librtaudio.a

        # -
        # {libbrotlienc,libbrotlicommon,libfreetype,libpixman-1,,libz,libFreeImage,libcairo,libglew,libpng,libssl,libcrypto,libglfw3,libpng16,libtess2,libcurl,libglm,,}.a

      # - ${var:ofPath}/OFLib/arm64-apple-darwin_Release/libOFW.a
      includeDirs:
        # - ${var:path}/src/
        # - ./src
        # - src/**
        - ${var:ofPath}/libs/openFrameworks/**
        - ${var:ofPath}/libs/openFrameworks
        # - ${var:ofPath}/addons/{${var:addons}}/src/
        # ofxAssimp have src/Source, ofxTools have src/ subfolders
        # - ${var:ofPath}/addons/{${var:addons}}/src/**
        # - ${var:ofPath}/addons/{${var:addons}}/libs/**/include/**/*
        # - ${var:ofPath}/addons/{${var:addons}}/libs/**/include

        # # ofxMidi, non standard paths
        # - ${var:ofPath}/addons/{${var:addons}}/libs/**

    files:
      include:
        # - src/*.cpp
        # - src/*.mm
        # - src/**/*.cpp
        # - ${var:ofPath}/addons/{${var:addons}}/src/**.cpp
        # - ${var:ofPath}/addons/{${var:addons}}/libs/**/**.cpp
        # - ${var:ofPath}/addons/{${var:addons}}/src/**.mm

      exclude:
        - .DS_Store
        - .settings
        - .vscode
        # - ${var:ofPath}/addons/{${var:addons}}/src/ios

    copyFilesOnRun[:macos]: ${var:path}/bin/data
distribution:
  empty:
    kind: bundle
    buildTargets: "*"
    exclude:
      - data/.gitkeep
    macosBundle:
      type: app
      icon: ${var:ofPath}/libs/openFrameworksCompiled/project/macos/of.icns
      infoPropertyList:
        CFBundleDevelopmentRegion: en-US
        CFBundleDisplayName: ${name}
        CFBundleExecutable: ${mainExecutable}
        CFBundleIconFile: ${icon}
        CFBundleIdentifier: com.developer.application
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: ${bundleName}
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1.0.0"
        CFBundleSignature: "????"
        LSMinimumSystemVersion: "10.8"
        NSHighResolutionCapable: true
