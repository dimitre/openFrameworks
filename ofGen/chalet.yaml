name: ofgen
version: 0.8.2
# variables:
# platform: xyz
# This doesn't work but doesn't error either.
# platform[:windows]: vs
# platform[:macos]: macos
# platform[:linux+architecture:x86_64]: linux64
# platform[:linux+architecture:arm64]: rpi-aarch64
# allowedArchitectures:
#   - x86_64-pc-windows-msvc
#   - i686-pc-windows-msvc
#   - arm64-apple-darwin
abstracts:*:
  language: C++
  # language[toolchain:apple-llvm]: Objective-C++
  settings:Cxx:
    cppStandard: c++20
    warningsPreset: minimal
    runtimeTypeInformation: true
    threads: true
    exceptions: true
targets:
  ofgen:
    kind: executable
    settings:Cxx:
      staticRuntimeLibrary: true
      compileOptions[toolchain:msvc]:
        - /MT
      # linkerOptions[toolchain:msvc]:
      #   - /NODEFAULTLIB:msvcrt.lib
      #   - /NODEFAULTLIB:msvcprt.lib
      includeDirs:
        - src
        - src/uuidxx/src
      # includeDirs:
      #   - ../libs/${var:platform}/include
      includeDirs[:windows]:
        - ../libs/vs/include/
      includeDirs[:macos]:
        - ../libs/macos/include/
      # includeDirs[:linux]:
      #   - ../libs/linux64/include/
      includeDirs[:linux+architecture:x86_64]:
        - ../libs/linux64/include/
      includeDirs[:linux+architecture:arm64]:
        - ../libs/rpi-aarch64/include/

      defines:
        # - YAML_CPP_NO_DLL
        - YAML_CPP_STATIC_DEFINE
      staticLinks[:windows]:
        - ../libs/vs/lib/pugixml.lib
        - ../libs/vs/lib/yaml-cpp.lib
        - ../libs/vs/lib/fmt.lib
      staticLinks[:macos]:
        - ../libs/macos/lib/libpugixml.a
        - ../libs/macos/lib/libyaml-cpp.a
        - ../libs/macos/lib/libfmt.a
      # staticLinks[:linux]:
      staticLinks[:linux+architecture:x86_64]:
        - ../libs/linux64/lib/libpugixml.a
        - ../libs/linux64/lib/libyaml-cpp.a
        - ../libs/linux64/lib/libfmt.a
      staticLinks[:linux+architecture:arm64]:
        - ../libs/rpi-aarch64/lib/libpugixml.a
        - ../libs/rpi-aarch64/lib/libyaml-cpp.a
        - ../libs/rpi-aarch64/lib/libfmt.a

    files:
      include:
        - src/*.cpp
        - src/uuidxx/src/*.cpp
      exclude:
        - cmake
        - .zed
distribution:
  ofgen:
    kind: bundle
    buildTargets: "*"
