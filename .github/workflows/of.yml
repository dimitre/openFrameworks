name: OF

# on: workflow_dispatch
on:
  push:
# concurrency:
#   group: ${{ github.workflow }}
#   cancel-in-progress: false

env:
  ccache: ccache
  GH_TOKEN: ${{ github.token }}

jobs:
  ofworks:
    strategy:
      # fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux64, shell: bash }
          # - { os: macos-26, platform: macos, shell: bash }
          - { os: macos-15, platform: macos, shell: bash }
          - { os: windows-latest, platform: vs, shell: powershell }
          - {
              platform: rpi-aarch64,
              os: ubuntu-22.04-arm,
              prefix: aarch64-linux-gnu,
              toolchain: aarch64-linux-gnu-gcc-12,
            }

    defaults:
      run:
        # working-directory: ${{ inputs.lib }}
        shell: bash
        # shell: ${{ matrix.shell }} {0}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install zip
        if: matrix.platform == 'vs'
        run: choco install zip -y

      - name: Cache Packages - Linux Apt
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: >
            wget2
            ninja-build
            libfontconfig1-dev
            libxrandr-dev
            libjack-jackd2-0 libjack-jackd2-dev libasound2-dev
            freeglut3-dev libxmu-dev libxxf86vm-dev libopenal-dev libsndfile1-dev libpulse-dev
            libgl1-mesa-dev libudev-dev libdrm-dev
            libxcursor-dev libxi-dev libxinerama-dev
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-pulseaudio
            gstreamer1.0-x gstreamer1.0-plugins-bad gstreamer1.0-alsa
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
          version: 1.0

      - name: Cache Packages - macOS Brew
        if: runner.os == 'macOS'
        uses: tecolicom/actions-use-homebrew-tools@v1.3
        with:
          tools: wget2 ninja

      - name: Libs
        shell: bash
        run: ./libs/libs.sh

      - name: LS Libs
        shell: bash
        run: |
          ls libs/**/lib/*

      - name: Install Chalet
        # if: matrix.platform == 'vs'
        uses: jaxxstorm/action-install-gh-release@v2.1.0
        with:
          repo: chalet-org/chalet
          cache: enable
          extension: .zip
          prerelease: "false"

      # - name: Whereis Chalet
      #   run: |
      #     whereis chalet

      - name: Chalet Test / Version
        run: |
          chalet --version

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.19
        with:
          key: ${{ matrix.platform }}

      # - name: RPI - Compiler
      #   if: matrix.platform == 'rpi-aarch64' && runner.os == 'Linux'
      #   run: |
      #     sudo apt install gcc g++ binutils

      - name: ofgen compile
        if: runner.os != 'Windows'
        run: |
          cd ofGen
          ./compile.sh

      - name: ofgen compile windows chalet
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd ofGen
          ./compile.ps1
          # chalet bundle
          (Resolve-Path .\dist).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: ofgen test
        run: |
          ofgen colors

      - name: DEMO publish
        # if: matrix.platform == 'rpi-aarch64'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          cd examples/demos/flechilhas
          ofgen templates=chalet
          chalet bundle --compiler-cache
          zip -r ofWorks_${{ matrix.platform }}_flechilhas.zip dist/*
          gh release upload demo *.zip --clobber
