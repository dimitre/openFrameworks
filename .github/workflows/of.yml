          repo: chalet-org/chalet
          cache: enable
          extension: .zip
          prerelease: "false"

      - name: Chalet Test / Version
        run: |
          chalet --version

      - name: Libs
        if: runner.os != 'Windows'
        run: ./libs/libs.sh

      - name: Libs
        if: runner.os == 'Windows'
        # shell: powershell
        run: ./libs/libs.sh

