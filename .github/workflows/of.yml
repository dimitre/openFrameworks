        run: |
          cd examples/demos/flechilhas
          ofgen templates=chalet
          chalet bundle
          zip -r ${{ matrix.platform }}_flechilhas.zip dist/*
          ls -la ${{ matrix.platform }}_flechilhas.zip
          gh release upload demo ${{ matrix.platform }}_flechilhas.zip --clobber
