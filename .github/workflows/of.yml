name: OF

# on: workflow_dispatch
on:
  push:
# concurrency:
#   group: ${{ github.workflow }}
#   cancel-in-progress: false

env:
  ccache: ccache

jobs:
  ofworks:
    strategy:
      # fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux64, shell: bash }
          - { os: macos-26, platform: macos, shell: bash }
          - { os: windows-latest, platform: vs, shell: powershell }
          - {
              platform: rpi-aarch64,
              os: ubuntu-22.04-arm,
              prefix: aarch64-linux-gnu,
              toolchain: aarch64-linux-gnu-gcc-12,
            }

    defaults:
      run:
        # working-directory: ${{ inputs.lib }}
        shell: bash
        # shell: ${{ matrix.shell }} {0}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install zip
        if: matrix.platform == 'vs'
        run: choco install zip -y

      - name: Libs
        shell: bash
        run: ./libs/libs.sh

      - name: LS Libs
        shell: bash
        run: |
          ls libs/**/lib/*

      - name: Install Chalet
        # if: matrix.platform == 'vs'
        uses: jaxxstorm/action-install-gh-release@v2.1.0
        with:
          repo: chalet-org/chalet
          cache: enable
          extension: .zip
          prerelease: "false"

      # - name: Whereis Chalet
      #   run: |
      #     whereis chalet

      - name: Chalet Test / Version
        run: |
          chalet --version

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.19
        with:
          key: ${{ matrix.platform }}-${{ matrix.target }}

      # - name: RPI - Compiler
