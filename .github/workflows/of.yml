jobs:
  ofworks:
    strategy:
      matrix:
        # os: [macos-latest, ubuntu-latest, windows-latest]
        # os: [windows-latest]
        include:
          - { os: ubuntu-latest, platform: linux64, shell: bash }
          - { os: macos-latest, platform: macos, shell: bash }

          # - {
