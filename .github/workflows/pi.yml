      - name: Test MSYS2 tools
        if: runner.os == 'Windows' && matrix.platform == 'msys2'
        run: |
          whereis gcc
          whereis g++
          whereis c++
          whereis find
          whereis ar
          whereis pkgconf
          whereis ld
          ls /mingw64/bin/pkgconf
          ls /mingw64/bin/gcc
          ls /mingw64/bin/g++
          ls /mingw64/bin/c++
          ls /mingw64/bin/ld
