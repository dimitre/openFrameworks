jobs:
  ofworks:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu and macos completing good, so removed from here now.
          # - { os: ubuntu-latest, platform: linux64, shell: bash }
          # - { os: macos-26, platform: macos, shell: bash }
          # - { os: windows-latest, platform: vs, shell: powershell }
          - {
              platform: rpi-aarch64,
              os: ubuntu-22.04-arm,
              prefix: aarch64-linux-gnu,
              toolchain: aarch64-linux-gnu-gcc,
            }

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
