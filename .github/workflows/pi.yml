      - name: ofgen compile
        if: runner.os != 'Windows'
        run: |
          cd ofGen
          # chalet bundle
          # FIXME: script nao ta rolando no github actions
          ./compile.sh

      - name: ofgen compile windows chalet
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd ofGen
          ./compile.ps1
          # chalet bundle
          (Resolve-Path .\dist).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: ofgen test
        run: |
